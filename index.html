<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Gestor Personal - Nivel & Diario</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; transition: all 0.25s ease; }
    
    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
    }

    .container { max-width: 550px; margin: 0 auto; }

    /* SECCIÓN ROJA: NIVEL Y PERFIL (Inspirada en Foto 1) */
    .level-banner {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      border: 2px solid #f87171;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
      position: relative;
      overflow: hidden;
    }
    
    .level-banner::after {
      content: '';
      position: absolute;
      top: -30%; right: -20%;
      width: 180px; height: 180px;
      background: rgba(255, 255, 255, 0.12);
      transform: rotate(45deg);
      pointer-events: none;
    }

    .level-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .level-title {
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 0;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value { font-size: 1.3rem; font-weight: bold; color: #fef08a; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.85; }

    /* SECCIÓN DIARIO: GLASSMORPHISM & NEÓN (Inspirada en Fotos 2 y 3) */
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      margin-top: 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    button.save-btn {
      width: 100%;
      background: linear-gradient(90deg, #2563eb, #06b6d4);
      border: none;
      color: #fff;
      font-weight: bold;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
      font-size: 1rem;
    }

    button.save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    }

    /* FILTROS TIPO PÍLDORA (Foto 2) */
    .pills-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .pill {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    /* LISTA CON EFECTO DE BRILLO AZUL (Foto 3) */
    .item {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item:hover {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
      transform: scale(1.01);
    }

    .item.completed {
      opacity: 0.5;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .item.completed strong { text-decoration: line-through; }

    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
      display: inline-block;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .delete-btn:hover { background: #ef4444; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- SECCIÓN DE NIVEL (ESTILO ROJO ETIQUETA) -->
    <div class="level-banner">
      <div class="level-header">
        <h1 class="level-title">NIVEL <span id="userLevel">1</span></h1>
        <span style="font-weight: bold; font-size: 0.9rem; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 8px;">🔥 Racha: <span id="streakDays">1</span>d</span>
      </div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalItems">0</div>
          <div class="stat-label">Registros</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="doneItems">0</div>
          <div class="stat-label">Listos</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="xpPoints">0</div>
          <div class="stat-label">Puntos XP</div>
        </div>
      </div>
    </div>

    <!-- SECCIÓN DIARIO (FORMULARIO Y FILTROS GLASS/NEÓN) -->
    <div class="glass-card">
      <input type="text" id="title" placeholder="¿Qué quieres registrar hoy en tu diario?">
      <select id="category">
        <option value="Tarea">📝 Tarea</option>
        <option value="Idea">💡 Idea</option>
        <option value="Hábito">⚡ Hábito</option>
        <option value="Nota">📌 Nota</option>
      </select>
      <button class="save-btn" onclick="addItem()">Guardar en Diario</button>
    </div>

    <!-- FILTROS EN PÍLDORA -->
    <div class="pills-container">
      <button class="pill active" onclick="filterCategory('Todas', this)">Todas</button>
      <button class="pill" onclick="filterCategory('Tarea', this)">📝 Tareas</button>
      <button class="pill" onclick="filterCategory('Idea', this)">💡 Ideas</button>
      <button class="pill" onclick="filterCategory('Hábito', this)">⚡ Hábitos</button>
      <button class="pill" onclick="filterCategory('Nota', this)">📌 Notas</button>
    </div>

    <!-- LISTA DE REGISTROS -->
    <div id="list"></div>

  </div>

  <script>
    let items = JSON.parse(localStorage.getItem('my_app_data')) || [];
    let currentFilter = 'Todas';

    function updateLevelStats() {
      const completed = items.filter(i => i.done).length;
      const total = items.length;
      const xp = completed * 50 + total * 10;
      const level = Math.floor(xp / 150) + 1;

      document.getElementById('totalItems').innerText = total;
      document.getElementById('doneItems').innerText = completed;
      document.getElementById('xpPoints').innerText = xp;
      document.getElementById('userLevel').innerText = level;
    }

    function saveAndRender() {
      localStorage.setItem('my_app_data', JSON.stringify(items));
      updateLevelStats();

      const list = document.getElementById('list');
      list.innerHTML = '';

      const filteredItems = currentFilter === 'Todas' 
        ? items 
        : items.filter(item => item.category === currentFilter);

      filteredItems.forEach((item, index) => {
        const realIndex = items.indexOf(item);
        list.innerHTML += `
          <div class="item ${item.done ? 'completed' : ''}">
            <div onclick="toggleItem(${realIndex})" style="flex-grow: 1; cursor: pointer;">
              <div><strong>${item.title}</strong></div>
              <span class="badge">${item.category}</span>
              <span style="font-size: 0.7rem; opacity: 0.6; margin-left: 8px;">${item.date || ''}</span>
            </div>
            <button class="delete-btn" onclick="deleteItem(${realIndex})">✕</button>
          </div>
        `;
      });
    }

    function addItem() {
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      if (!title) return;
      
      items.unshift({ 
        title, 
        category, 
        done: false, 
        date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) 
      });
      
      document.getElementById('title').value = '';
      saveAndRender();
    }

    function toggleItem(index) {
      items[index].done = !items[index].done;
      saveAndRender();
    }

    function deleteItem(index) {
      items.splice(index, 1);
      saveAndRender();
    }

    function filterCategory(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      saveAndRender();
    }

    saveAndRender();
  </script>
</body>
</html>
