<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Kido App - Nemu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        /* Contenedor principal para el efecto de difuminado */
        #app-content {
            transition: all 0.4s ease;
        }
        .difuminado {
            filter: blur(8px);
            opacity: 0.6;
            pointer-events: none;
        }

        .header { margin-top: 30px; margin-bottom: 25px; }
        .header h1 { 
            font-size: 28px; 
            background: -webkit-linear-gradient(#ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .header p { color: #8e8e93; font-size: 16px; margin: 0; }

        .widget {
            background-color: #1c1c1e;
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.05);
            border: 1px solid #2c2c2e;
            margin: 0 auto 25px auto;
            max-width: 400px;
        }
        
        .widget h2 { font-size: 20px; margin-top: 0; margin-bottom: 20px; font-weight: 600; transition: all 0.3s; }

        /* Estilo de Botones 3D */
        .btn-mood {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background-color: #2c2c2e;
            border: 2px solid #3a3a3c;
            border-radius: 18px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
            text-align: left;
        }
        
        /* Efecto de presionar el botón 3D */
