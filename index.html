<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kido App</title>
  <style>
    /* =========================================
       ESTILOS GENERALES Y MENÚ (KIDO APP)
       ========================================= */
    body {
      margin: 0;
      padding: 0;
      background-color: #05090c;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    header {
      background-color: #0b1319;
      padding: 15px 20px;
      border-bottom: 2px solid #288f96;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    header h1 {
      margin: 0;
      color: #4bd5db;
      font-size: 1.5rem;
    }

    nav button {
      background: transparent;
      color: #4bd5db;
      border: 1px solid #4bd5db;
      padding: 8px 15px;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s;
    }

    nav button:hover, nav button.active {
      background: #288f96;
      color: #0b1319;
      font-weight: bold;
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* =========================================
       ESTILOS DEL UNIVERSO ACADÉMICO (ESPACIAL)
       ========================================= */
    .space-console {
      background-color: #0b1319;
      border: 2px solid #288f96;
      border-radius: 15px;
      padding: 20px;
      position: relative;
      min-height: 550px;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #4bd5db;
    }

    .console-header {
      border-bottom: 1px dashed #f28b30;
      padding-bottom: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .console-header h2 {
      color: #f28b30;
      margin: 0;
      font-size: 1.5rem;
    }

    .solar-system {
      position: relative;
      width: 100%;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* El Sol / Centro */
    .sun {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #fcf4a3 0%, #f28b30 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px #f28b30;
      position: absolute;
      z-index: 2;
    }

    /* Los Planetas (Materias) */
    .planet-container {
      position: absolute;
      cursor: pointer;
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 3;
    }

    .planet-container:hover {
      transform: scale(1.15);
      z-index: 5;
    }

    .planet {
      border-radius: 50%;
      box-shadow: inset -10px -10px 15px rgba(0,0,0,0.6), 0 0 15px rgba(75, 213, 219, 0.4);
    }

    .planet-label {
      font-size: 0.85rem;
      background: rgba(11, 19, 25, 0.9);
      padding: 3px 8px;
      border: 1px solid #4bd5db;
      border-radius: 4px;
      white-space: nowrap;
      font-weight: bold;
    }

    .star-count {
      color: #fce83a;
      font-weight: bold;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.5);
      padding: 2px 5px;
      border-radius: 3px;
    }

    /* Órbitas visuales */
    .orbit-ring {
      position: absolute;
      border: 1px dashed rgba(75, 213, 219, 0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    /* Panel interactivo */
    .planet-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(11, 19, 25, 0.95);
      border: 2px solid #f28b30;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 0 30px rgba(242, 139, 48, 0.4);
      min-width: 250px;
    }

    .planet-panel.hidden {
      display: none;
    }

    .star-container {
      font-size: 2rem;
      margin: 15px 0;
      color: rgba(75, 213, 219, 0.3); 
    }

    .star-container .filled {
      color: #fce83a; 
      text-shadow: 0 0 15px #fce83a;
    }

    .add-star-btn, .close-btn, .reset-btn {
      color: #0b1319;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px;
      font-family: 'Courier New', Courier, monospace;
      transition: background 0.3s;
    }
    
    .add-star-btn { background: #288f96; width: 100%; margin-bottom: 10px; }
    .add-star-btn:hover { background: #4bd5db; }
    
    .close-btn { background: #f28b30; }
    .close-btn:hover { background: #ffaa5e; }

    .reset-btn { background: #8b0000; color: white;}
    .reset-btn:hover { background: #ff5e5e; }
  </style>
</head>
<body>

  <!-- MENÚ DE NAVEGACIÓN -->
  <header>
    <h1>Kido App</h1>
    <nav>
      <button onclick="openTab('inicio')" id="btn-inicio" class="active">Inicio</button>
      <button onclick="openTab('universo')" id="btn-universo">Universo Académico</button>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    
    <!-- PESTAÑA DE INICIO (Ejemplo) -->
    <div id="tab-inicio" class="tab-content active">
      <h2>Bienvenido de vuelta, Nivek</h2>
      <p>Selecciona "Universo Académico" en el menú superior para ver el progreso de tus materias.</p>
    </div>

    <!-- PESTAÑA DEL SISTEMA SOLAR -->
    <div id="tab-universo" class="tab-content">
      <div class="space-console">
        <div class="console-header">
          <h2>SISTEMA DE PROGRESO ACADÉMICO</h2>
          <p>SEMESTRE ACTUAL // PSICOLOGÍA</p>
        </div>
        
        <div class="solar-system" id="solar-system">
          <!-- Generado por JS -->
        </div>

        <!-- Panel de Control de Materia -->
        <div id="planet-panel" class="planet-panel hidden">
          <h3 id="panel-subject-name" style="color: #4bd5db; margin-top: 0;">Materia</h3>
          <p>Progreso del semestre:</p>
          <div id="star-container" class="star-container"></div>
          <button class="add-star-btn" onclick="addStar()">[+] AGREGAR ESTRELLA</button>
          <div>
            <button class="reset-btn" onclick="resetStars()">Reiniciar</button>
            <button class="close-btn" onclick="closePanel()">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- SCRIPTS -->
  <script>
    // =========================================
    // NAVEGACIÓN ENTRE PESTAÑAS
    // =========================================
    function openTab(tabId) {
      // Ocultar todas las pestañas
      const tabs = document.querySelectorAll('.tab-content');
      tabs.forEach(tab => tab.classList.remove('active'));
      
      // Desactivar todos los botones
      const buttons = document.querySelectorAll('nav button');
      buttons.forEach(btn => btn.classList.remove('active'));
      
      // Mostrar la pestaña seleccionada y activar su botón
      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`btn-${tabId}`).classList.add('active');
    }

    // =========================================
    // LÓGICA DEL UNIVERSO ACADÉMICO
    // =========================================
    
    // Configuración de las materias de Psicología
    const subjects = [
      { id: 'clinica', name: 'Psic. Clínica', size: 45, color: 'radial-gradient(circle, #ff5e5e, #8b0000)', orbit: 100, angle: 0 },
      { id: 'social', name: 'Psic. Social', size: 35, color: 'radial-gradient(circle, #5eff7e, #006b1b)', orbit: 145, angle: 72 },
      { id: 'neuro', name: 'Neuropsicología', size: 50, color: 'radial-gradient(circle, #5ec3ff, #004b8b)', orbit: 190, angle: 144 },
      { id: 'educativa', name: 'Psic. Educativa', size: 40, color: 'radial-gradient(circle, #d95eff, #59008b)', orbit: 235, angle: 216 },
      { id: 'psicometria', name: 'Psicometría', size: 30, color: 'radial-gradient(circle, #ffb35e, #8b4500)', orbit: 280, angle: 288 }
    ];

    let currentSubjectId = null;

    function initSolarSystem() {
      const container = document.getElementById('solar-system');
      container.innerHTML = '<div class="sun"></div>'; 
      
      subjects.forEach(subject => {
        // Dibujar los anillos de órbita visuales
        const ring = document.createElement('div');
        ring.className = 'orbit-ring';
        ring.style.width = `${subject.orbit * 2}px`;
        ring.style.height = `${subject.orbit * 2}px`;
        container.appendChild(ring);

        // Recuperar estrellas guardadas en LocalStorage
        const stars = parseInt(localStorage.getItem(`stars_${subject.id}`)) || 0;
        
        const planetEl = document.createElement('div');
        planetEl.className = 'planet-container';
        planetEl.id = `planet-container-${subject.id}`;
        
        // Posicionar planetas en círculo
        const rad = subject.angle * (Math.PI / 180);
        const x = Math.cos(rad) * subject.orbit;
        const y = Math.sin(rad) * subject.orbit;
        planetEl.style.transform = `translate(${x}px, ${y}px)`;
        
        planetEl.innerHTML = `
          <div class="planet" style="width:${subject.size}px; height:${subject.size}px; background:${subject.color};"></div>
          <div class="planet-label">${subject.name}</div>
          <div class="star-count" id="count-${subject.id}">⭐ ${stars}/5</div>
        `;
        
        planetEl.onclick = () => openPlanetPanel(subject.id);
        container.appendChild(planetEl);
      });
    }

    function openPlanetPanel(subjectId) {
      currentSubjectId = subjectId;
      const subject = subjects.find(s => s.id === subjectId);
      const stars = parseInt(localStorage.getItem(`stars_${subjectId}`)) || 0;
      
      document.getElementById('panel-subject-name').innerText = subject.name;
      updateStarVisuals(stars);
      
      document.getElementById('planet-panel').classList.remove('hidden');
    }

    function closePanel() {
      document.getElementById('planet-panel').classList.add('hidden');
      currentSubjectId = null;
    }

    function addStar() {
      if(!currentSubjectId) return;
      
      let currentStars = parseInt(localStorage.getItem(`stars_${currentSubjectId}`)) || 0;
      if(currentStars < 5) {
        currentStars++;
        localStorage.setItem(`stars_${currentSubjectId}`, currentStars);
        
        updateStarVisuals(currentStars);
        document.getElementById(`count-${currentSubjectId}`).innerText = `⭐ ${currentStars}/5`;
      } else {
        alert("¡Has completado todas las estrellas para esta materia!");
      }
    }

    function resetStars() {
      if(!currentSubjectId) return;
      if(confirm("¿Estás seguro de que quieres reiniciar las estrellas de esta materia?")) {
        localStorage.setItem(`stars_${currentSubjectId}`, 0);
        updateStarVisuals(0);
        document.getElementById(`count-${currentSubjectId}`).innerText = `⭐ 0/5`;
      }
    }

    function updateStarVisuals(starCount) {
      let html = '';
      for(let i=1; i<=5; i++) {
        if(i <= starCount) {
          html += '<span class="filled">★</span>';
        } else {
          html += '<span>★</span>'; // Uso la misma figura pero sin la clase 'filled'
        }
      }
      document.getElementById('star-container').innerHTML = html;
    }

    // Iniciar todo al cargar la página
    document.addEventListener('DOMContentLoaded', initSolarSystem);
  </script>
</body>
</html>
