<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Kido App - Nemu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        /* Contenedor principal para el efecto de difuminado */
        #app-content {
            transition: all 0.4s ease;
        }
        .difuminado {
            filter: blur(8px);
            opacity: 0.6;
            pointer-events: none;
        }

        .header { margin-top: 30px; margin-bottom: 25px; }
        .header h1 { 
            font-size: 28px; 
            background: -webkit-linear-gradient(#ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .header p { color: #8e8e93; font-size: 16px; margin: 0; }

        .widget {
            background-color: #1c1c1e;
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.05);
            border: 1px solid #2c2c2e;
            margin: 0 auto 25px auto;
            max-width: 400px;
        }
        
        .widget h2 { font-size: 20px; margin-top: 0; margin-bottom: 20px; font-weight: 600; transition: all 0.3s; }

        /* Estilo de Botones 3D */
        .btn-mood {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background-color: #2c2c2e;
            border: 2px solid #3a3a3c;
            border-radius: 18px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
            text-align: left;
        }
        
        /* Efecto de presionar el botón 3D */
        .btn-mood:active { top: 6px; box-shadow: 0 0px 0 transparent !important; }

        /* Sombras 3D personalizadas para cada emoción */
        .btn-feliz { border-color: #34c759; box-shadow: 0 6px 0 #1e7a35; }
        .btn-normal { border-color: #ffcc00; box-shadow: 0 6px 0 #b38f00; }
        .btn-triste { border-color: #007aff; box-shadow: 0 6px 0 #004d9e; }
        .btn-decepcionado { border-color: #af52de; box-shadow: 0 6px 0 #6e2594; }
        .btn-jodido { border-color: #ff3b30; box-shadow: 0 6px 0 #991c15; }
        
        .emoji { font-size: 24px; margin-right: 12px; vertical-align: middle; }

        /* Área de texto 3D invertida (hundida) */
        .nota-input {
            width: 100%;
            height: 120px;
            background-color: #0a0a0a;
            color: white;
            border: 2px solid #333;
            border-radius: 18px;
            padding: 15px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8);
            transition: border-color 0.3s;
        }
        .nota-input:focus { border-color: #ff3b30; outline: none; }

        /* Botón Rojo 3D para Enviar */
        .btn-rojo {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #ff453a, #d62828);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 #8b0000, 0 12px 20px rgba(255, 59, 48, 0.4);
            transition: all 0.1s ease;
        }
        .btn-rojo:active { top: 6px; box-shadow: 0 0px 0 #8b0000, 0 4px 6px rgba(255, 59, 48, 0.4); }

    </style>
</head>
<body>

    <div id="app-content">
        <div class="header">
            <h1>Bienvenido, Nivek</h1>
            <p id="saludo-tiempo">Nemu está en línea.</p>
        </div>

        <!-- Casillero de Emociones -->
        <div class="widget">
            <h2 id="pregunta-mood">¿Cómo te sientes hoy?</h2>
            <button class="btn-mood btn-feliz" onclick="registrarEmocion('Feliz')">
                <span class="emoji">😁</span> Feliz
            </button>
            <button class="btn-mood btn-normal" onclick="registrarEmocion('Normal')">
                <span class="emoji">😐</span> Normal
            </button>
            <button class="btn-mood btn-triste" onclick="registrarEmocion('Triste')">
                <span class="emoji">😔</span> Triste
            </button>
            <button class="btn-mood btn-decepcionado" onclick="registrarEmocion('Decepcionado')">
                <span class="emoji">😞</span> Decepcionado
            </button>
            <button class="btn-mood btn-jodido" onclick="registrarEmocion('Jodido en la v*rga')">
                <span class="emoji">🤬</span> Jodido en la v*rga
            </button>
        </div>

        <!-- Nuevo Casillero de Notas Mentales -->
        <div class="widget">
            <h2>Descarga tus pensamientos</h2>
            <textarea id="nota-texto" class="nota-input" placeholder="Escribe aquí tu nota mental..."></textarea>
            <button id="btn-enviar-nota" class="btn-rojo" onclick="enviarNota()">Guardar Nota Mental</button>
        </div>
    </div>

    <script>
        const tuCorreo = "albankevine845@gmail.com"; // Tu correo destino
        const appContent = document.getElementById('app-content');
        
        // Lógica de hora
        const hora = new Date().getHours();
        const preguntaEl = document.getElementById('pregunta-mood');
        const saludoEl = document.getElementById('saludo-tiempo');
        let preguntaOriginal = "";

        if (hora >= 5 && hora < 12) {
            saludoEl.innerText = "Reporte matutino - 6 AM";
            preguntaOriginal = "¿Cómo te sientes esta mañana?";
        } else if (hora >= 12 && hora < 17) {
            saludoEl.innerText = "Reporte de mediodía - 12 PM";
            preguntaOriginal = "¿Cómo te sientes a esta hora?";
        } else {
            saludoEl.innerText = "Reporte de cierre - 5 PM";
            preguntaOriginal = "¿Cómo terminas el día?";
        }
        preguntaEl.innerText = preguntaOriginal;

        // Función para enviar Emociones
        function registrarEmocion(estado) {
            appContent.classList.add('difuminado'); // Aplica efecto borroso
            
            fetch("https://formsubmit.co/ajax/" + tuCorreo, {
                method: "POST",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    _subject: "Nemu Reporte: Nivek se siente " + estado,
                    Mensaje: "Hora del reporte: " + new Date().toLocaleTimeString(),
                    Estado: estado
                })
            }).then(() => {
                preguntaEl.innerText = "¡Reporte guardado! 🤍";
                preguntaEl.style.color = "#34c759";
                appContent.classList.remove('difuminado'); // Quita efecto borroso
                setTimeout(() => { 
                    preguntaEl.innerText = preguntaOriginal; 
                    preguntaEl.style.color = "white";
                }, 3000);
            }).catch(() => {
                appContent.classList.remove('difuminado');
            });
        }

        // Nueva Función para enviar Notas Mentales
        function enviarNota() {
            const campoTexto = document.getElementById('nota-texto');
            const texto = campoTexto.value;
            const btnRojo = document.getElementById('btn-enviar-nota');

            // Si está vacío, no hace nada
            if (texto.trim() === "") return;

            // Inicia el difuminado y cambia el botón
            appContent.classList.add('difuminado');
            btnRojo.innerText = "Enviando al sistema...";

            fetch("https://formsubmit.co/ajax/" + tuCorreo, {
                method: "POST",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    _subject: "nota mental partida",
                    Contenido: texto,
                    Hora: new Date().toLocaleTimeString()
                })
            }).then(() => {
                // Éxito
                campoTexto.value = ""; // Limpia la caja
                btnRojo.innerText = "¡Nota Guardada! ✔️";
                appContent.classList.remove('difuminado'); // Quita efecto borroso
                
                setTimeout(() => { 
                    btnRojo.innerText = "Guardar Nota Mental"; 
                }, 3000);
            }).catch(() => {
                // Error
                btnRojo.innerText = "Error de conexión";
                appContent.classList.remove('difuminado');
                setTimeout(() => { btnRojo.innerText = "Guardar Nota Mental"; }, 3000);
            });
        }
    </script>
</body>
</html>
