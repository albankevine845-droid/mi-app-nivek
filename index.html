<!-- MÓDULO: UNIVERSO ACADÉMICO -->
<div id="universo-academico" class="glass-card tab-content" style="display: none;"> <!-- Quita el display:none si quieres que sea visible por defecto -->
  <div class="glass-header text-center">
    <h2 class="gradient-text">Cosmos Académico</h2>
    <p class="subtitle">Psicología - Semestre Actual</p>
  </div>
  
  <div class="solar-system-container" id="solar-system-container">
    <!-- El Sol y los planetas se inyectarán desde JavaScript -->
  </div>

  <!-- Modal Liquid Glass para interactuar con la materia -->
  <div id="planet-modal" class="glass-modal hidden">
    <div class="glass-modal-content">
      <h3 id="modal-subject">Materia</h3>
      <div class="stars-display" id="stars-display"></div>
      <p class="progress-text" id="progress-text">Progreso: 0/5 estrellas</p>
      <div class="modal-actions">
        <button class="glass-btn primary-btn" onclick="addSubjectStar()">Añadir Estrella ⭐</button>
        <button class="glass-btn close-btn" onclick="closePlanetModal()">Cerrar</button>
      </div>
    </div>
  </div>
</div>
